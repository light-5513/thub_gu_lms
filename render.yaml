services:
  - type: web
    runtime: python
    plan: free
    name: lms
    rootDir: .
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      cd frontend &&
      npm ci --no-audit --no-fund &&
      npm run build &&
      cd ..
    startCommand: PYTHONPATH=/opt/render/project/src:$PYTHONPATH uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: lms
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_DIST_DIR
        value: ./frontend/dist
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"