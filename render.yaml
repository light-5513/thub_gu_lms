services:
  - type: web
    env: docker
    plan: free
    name: lms
    rootDir: .
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: lms
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_DIST_DIR
        value: ./frontend/dist
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: WHATSAPP_API_URL
        fromService:
          name: lms-whatsapp-api-free
          type: web
          envVarKey: WHATSAPP_PUBLIC_URL
      - key: WHATSAPP_API_TOKEN
        fromService:
          name: lms-whatsapp-api-free
          type: web
          envVarKey: WHATSAPP_API_TOKEN

  - type: web
    env: docker
    plan: free
    name: lms-whatsapp-api-free
    healthCheckPath: /health
    dockerfilePath: ./whatsapp-api/Dockerfile
    dockerContext: ./whatsapp-api
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: WHATSAPP_API_TOKEN
        generateValue: true
      - key: WHATSAPP_OUTBOX_KEY
        generateValue: true
      - key: WHATSAPP_SESSION_NAME
        value: lms-invitations
      - key: WHATSAPP_PUBLIC_URL
        fromService:
          name: lms-whatsapp-api-free
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGODB_URI
        fromService:
          name: lms
          type: web
          envVarKey: MONGODB_URI
      - key: MONGODB_DATABASE
        fromService:
          name: lms
          type: web
          envVarKey: MONGODB_DATABASE
